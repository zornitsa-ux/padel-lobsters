name: E2E (nightly)

# Deliberately NOT on pull_request/push — a full run drives real Chrome
# through a two-role tournament flow against a real local Supabase, on the
# order of a minute-plus. That's an unacceptable tax on every PR for a single
# smoke test. Nightly (plus manual dispatch) catches a regression within a
# day without slowing anyone's merge.
#
# See e2e/tournament-flow.spec.ts for what this actually covers, and the
# spike report in the PR that introduced this file for the Playwright vs.
# puppeteer-core comparison that motivated it.

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily — off the hour, avoids GH Actions' peak-minute queueing
  workflow_dispatch: {}

jobs:
  e2e:
    name: Tournament run-of-show smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright's Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Chromium is cached but its OS-level shared libs (--with-deps) are not
      # part of that cache, so they still need installing on a cache hit.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Same fixed local values `db:reset` and every contributor's machine
      # use — see .env.localdev.example. `supabase start` replays every
      # migration and supabase/seed.sql on a fresh runner, so this is
      # equivalent to a local `db:start && db:reset`.
      - name: Configure local env
        run: cp .env.localdev.example .env.localdev

      - name: Start Supabase
        run: npx supabase start

      - name: Run the smoke test
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
