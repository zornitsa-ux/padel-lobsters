name: DB types

# Fails if src/lib/database.types.ts is out of date with supabase/migrations.
#
# Deliberately its own workflow rather than a step in ci.yml: generating types
# needs a running Postgres, which costs a couple of minutes, and the types can
# only go stale when a migration changes. Path-filtering keeps that cost off
# every other PR.

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'src/lib/database.types.ts'
      - '.github/workflows/db-types.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'src/lib/database.types.ts'

jobs:
  drift:
    name: database.types.ts is current
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # The CLI comes from the `supabase` devDependency rather than
      # supabase/setup-cli, so package-lock.json is the single place the version
      # is pinned. A second pin here drifted ahead once and changed
      # `db query --output-format json`'s shape, breaking dump-function-grants.sh
      # with no code change on our side. The binary ships as an optional
      # dependency, not a postinstall download, so --ignore-scripts is fine.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # `db start` replays every migration in supabase/migrations, so the
      # generated types reflect the repo rather than whatever is deployed.
      - name: Start Supabase
        run: npx supabase start

      # Delegates to scripts/gen-db-types.sh so CI and a developer's machine run
      # byte-identical generation. This step used to inline its own copy of the
      # pipeline, which is three places the Prettier step or the CLI flags had
      # to be kept in sync; the annotation below is the only CI-specific part.
      - name: Check for drift
        run: |
          if ! npm run --silent db:types:check; then
            echo '::error::database.types.ts is stale. Run `npm run db:types` and commit the result.'
            exit 1
          fi
          echo 'database.types.ts matches the migrations.'

      # Same idea as the types check above, applied to function EXECUTE grants:
      # the stack from `supabase start` is already running, so checking the
      # anon/authenticated allowlist here is nearly free and catches a
      # migration that silently re-widens (or narrows) who can call what.
      - name: Check for function grant drift
        run: npm run db:grants:check
