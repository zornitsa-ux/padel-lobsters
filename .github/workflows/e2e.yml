name: E2E

# Runs on every PR that can change app behaviour, and nightly on main. Trial
# (owner, 2026-10-29): measure what it adds to a PR, then decide between the
# full suite and a smoke subset (docs/design-system/PLAN.md, "E2E safety
# net"). The job runs the database tests in supabase/tests, then the
# Playwright specs in e2e/.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.env.localdev.example'
      - '.github/workflows/e2e.yml'
      - '.github/actions/start-supabase/**'
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily — off the hour, avoids GH Actions' peak-minute queueing
  workflow_dispatch: {}

# A newer push to a PR cancels its running job; nightly and manual runs each
# get their own group, so neither cancels the other.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright against local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright's Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Chromium is cached but its OS-level shared libs (--with-deps) are not
      # part of that cache, so they still need installing on a cache hit.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Same fixed local values `db:reset` and every contributor's machine
      # use — see .env.localdev.example. `supabase start` replays every
      # migration and supabase/seed.sql on a fresh runner, so this is
      # equivalent to a local `db:start && db:reset`.
      - name: Configure local env
        run: cp .env.localdev.example .env.localdev

      - name: Start Supabase
        uses: ./.github/actions/start-supabase

      - name: Run the database tests
        run: npm run db:test

      - name: Run the e2e suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
