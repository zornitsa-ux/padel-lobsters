# =============================================================================
#  Supabase Local Development Configuration
#
#  This file configures the local Supabase stack (Postgres, Auth, Edge Functions)
#  that runs via Docker. Use `supabase start` to spin it up.
#
#  Docs: https://supabase.com/docs/guides/local-development
# =============================================================================

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
# Wildcards so any path under the dev origin (notably /auth/confirm with
# its query string) passes the redirect-URL allow-list. Without this,
# GoTrue silently rejects custom emailRedirectTo values and falls back
# to site_url — which can produce malformed links if a template tries
# to append to .RedirectTo.
additional_redirect_urls = [
  "http://127.0.0.1:5173/**",
  "http://localhost:5173/**",
  "https://127.0.0.1:5173",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# Settings from docs/pin-auth-removal/DESIGN.md §2 and D-17. Hosted values live
# in the dashboard; keep these in step with it. The hosted "require current
# password when updating" setting is on, but it has no key here, so it's off
# locally. It applies only to sessions that signed in with a password.
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

# Raised for tournament day: shared venue Wi-Fi counts as one IP (F-7).
[auth.rate_limit]
email_sent = 150
sign_in_sign_ups = 150
token_verifications = 150

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "60s"
otp_length = 6
# Also governs recovery and email-change links. The templates say "1 hour".
otp_expiry = 3600

# Auth email templates. confirmation, recovery and reauthentication show the
# 6-digit code first (typed into the app, which works inside an iOS home-screen
# install), then a token_hash link through the SPA's /auth/confirm route.
# magic_link and email_change are link-only (see below). None uses
# {{ .ConfirmationURL }}: it builds against GoTrue's external URL, and Kong only
# forwards /auth/v1/*, so the bare /verify path 404s locally. The same files are
# pasted into the hosted dashboard.
#
# magic_link stays link-only until the sign-in form has a code field (PR 2/3):
# a code with nowhere to type it gets typed into the PIN field.
[auth.email.template.magic_link]
subject = "Sign in to Padel Lobsters"
content_path = "./supabase/templates/magic_link.html"

# Sent instead of magic_link to a brand-new address when confirmations are on
# (hosted has them on).
[auth.email.template.confirmation]
subject = "Confirm your email for Padel Lobsters"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Padel Lobsters password"
content_path = "./supabase/templates/recovery.html"

# Code only: reauthenticate() expects the code back as updateUser's nonce.
[auth.email.template.reauthentication]
subject = "Your Padel Lobsters confirmation code"
content_path = "./supabase/templates/reauthentication.html"

# Email-change confirmation. Same Kong-prefix workaround as magic_link.
# With double_confirm_changes=true (see above) this template is sent to
# BOTH the current and new addresses; each link redeems the appropriate
# side via supabase.auth.verifyOtp({ type: 'email_change' }).
[auth.email.template.email_change]
subject = "Confirm your Padel Lobsters email change"
content_path = "./supabase/templates/email_change.html"

# Custom access token hook. Lives in the public schema (see migration
# 20260528000000_magic_link_auth.sql). Injects {role} claims into every
# token issuance regardless of sign-in method (PIN, magic link, future
# OAuth) so authz reads the same JWT shape for all paths.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

# Validates native signup metadata before GoTrue creates the user (migration
# 20261020130000, docs/pin-auth-removal C-3).
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/before_user_created_hook"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.verify-pin]
verify_jwt = false

[functions.send-pin-email]
verify_jwt = false

[functions.send-invite-email]
verify_jwt = false

[analytics]
enabled = false
