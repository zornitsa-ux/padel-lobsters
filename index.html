<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />

    <!-- Start the DNS + TLS handshake to Supabase during HTML parse. Without
         this it only begins once the entry chunk has downloaded and executed,
         serialising ~70ms of connection setup ahead of the first query. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#2E7D8C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Padel Lobsters" />
    <title>Padel Lobsters</title>
    <!-- Site-wide link preview. Shared event links get their own tags from
         api/event-preview (crawlers only, see vercel.json). -->
    <meta
      name="description"
      content="The Amsterdam padel community. See upcoming events and join the next one."
    />
    <meta property="og:site_name" content="Padel Lobsters" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Padel Lobsters" />
    <meta
      property="og:description"
      content="The Amsterdam padel community. See upcoming events and join the next one."
    />
    <meta property="og:url" content="https://padelobsters.nl" />
    <meta property="og:image" content="https://padelobsters.nl/logo-hd.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
